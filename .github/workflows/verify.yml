# Chạy toàn bộ kiểm tra chất lượng trên mỗi push và pull request.
#
# Mục đích cho việc bàn giao: người tiếp nhận có lưới an toàn tự động,
# không phải nhớ chạy tay. Một lần chạy gồm: kiểm kiểu → lint → test →
# build, đúng như lệnh `npm run verify` ở máy cá nhân.
name: Kiểm tra chất lượng

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài đặt phụ thuộc
        run: npm ci

      - name: Kiểm kiểu TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Kiểm thử đơn vị
        run: npm test

      # Build cần 2 biến môi trường công khai. Giá trị giả là đủ vì bước
      # này chỉ biên dịch, không gọi database.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      # Chặn merge nếu có truy vấn database không kiểm lỗi. Hiện đang ở
      # mức 0/0 — đây là cách giữ nguyên, thay vì để tích lũy lại như trước.
      # Chỗ nào CỐ Ý bỏ qua thì ghi `// audit-ok: <lý do>` ngay trên lời gọi.
      - name: Truy vấn database phải kiểm lỗi
        run: python3 scripts/audit-unchecked-db.py --strict
